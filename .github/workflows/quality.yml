name: Quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format
        run: cargo fmt --check

      - name: Unit and integration tests
        run: cargo test --all-targets --all-features

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Dependency audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: License and dependency policy
        run: |
          cargo install cargo-deny --locked
          cargo deny check

      - name: Build release binary
        run: cargo build --release

      - name: Start server
        run: |
          target/release/resonique-server > /tmp/resonique.log 2>&1 &
          echo $! > /tmp/resonique.pid
          for attempt in {1..30}; do
            curl --fail http://127.0.0.1:3000/health && break
            sleep 1
          done

      - name: API security smoke tests
        run: ./scripts/security-test.sh

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/resonique.pid ]; then
            kill "$(cat /tmp/resonique.pid)" || true
          fi

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Enforce 100% line coverage
        run: cargo llvm-cov --workspace --all-features --all-targets --fail-under-lines 100